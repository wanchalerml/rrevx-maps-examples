<!doctype html>
<!--
  RRevX Maps API กับ Leaflet (ใช้ปลั๊กอิน @maplibre/maplibre-gl-leaflet แสดง vector tiles)
  เหมาะกับเว็บที่ใช้ Leaflet อยู่แล้ว: เปลี่ยนแค่ชั้นแผนที่พื้นหลัง ที่เหลือ (marker, popup, GeoJSON) ใช้โค้ด Leaflet เดิม
  เอกสาร: https://rrevx.com/maps/docs
-->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRevX Maps API · Leaflet example</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<style>html, body, #map { height: 100%; margin: 0; }</style>
</head>
<body>
<div id="map"></div>
<script>
  const KEY = 'rx_pub_YOUR_KEY';           // ← คีย์เว็บของคุณ
  const map = L.map('map').setView([13.7457, 100.5341], 13);   // Leaflet ใช้ [lat, lng]

  // ชั้นแผนที่พื้นหลังจาก RRevX (เครดิต © OpenMapTiles © OpenStreetMap มาจาก style เอง)
  L.maplibreGL({ style: `https://api.rrevx.com/v1/styles/liberty.json?key=${KEY}` }).addTo(map);

  // ที่เหลือเป็น Leaflet ปกติ
  L.marker([13.7467, 100.5349]).addTo(map).bindPopup('สยามพารากอน').openPopup();
</script>
</body>
</html>
